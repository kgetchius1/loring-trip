<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loring Trip — Lodging Assignments</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1117;
    --surface: #161b27;
    --surface2: #1e2535;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --muted: #7a8299;
    --accent: #4f8ef7;
    --accent-dim: rgba(79,142,247,0.12);
    --green: #3ecf8e;
    --green-dim: rgba(62,207,142,0.12);
    --pink: #f06292;
    --pink-dim: rgba(240,98,146,0.12);
    --amber: #ffb74d;
    --amber-dim: rgba(255,183,77,0.1);
    --red: #ef5350;
    --radius: 10px;
    --font: 'Barlow', sans-serif;
    --font-display: 'Barlow Condensed', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; min-height: 100vh; }

  /* LOADING */
  #loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 16px; }
  .spinner { width: 36px; height: 36px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--muted); font-size: 14px; }

  /* LOGIN */
  #login-screen { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 90; align-items: center; justify-content: center; }
  #login-screen.active { display: flex; }
  .login-box { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 420px; margin: 16px; }
  .login-logo { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: 0.04em; color: var(--text); margin-bottom: 4px; }
  .login-sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .login-box label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; display: block; margin-bottom: 8px; }
  .search-wrap { position: relative; }
  .search-wrap input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 11px 14px; color: var(--text); font-family: var(--font); font-size: 15px; outline: none; }
  .search-wrap input:focus { border-color: var(--accent); }
  #name-results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); overflow: hidden; z-index: 10; }
  .name-opt { padding: 10px 14px; cursor: pointer; font-size: 14px; transition: background 0.15s; }
  .name-opt:hover { background: var(--accent-dim); color: var(--accent); }
  .btn-primary { width: 100%; margin-top: 20px; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-family: var(--font); font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  /* MAIN APP */
  #app { display: none; }
  #app.active { display: block; }

  /* HEADER */
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; position: sticky; top: 0; z-index: 50; }
  .header-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .header-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: 0.04em; }
  .header-title span { color: var(--accent); }
  .header-user { display: flex; align-items: center; gap: 10px; }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-dim); border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--accent); }
  .user-name { font-size: 13px; color: var(--muted); max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-logout { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .btn-logout:hover { color: var(--text); background: var(--surface2); }

  /* MY CARD */
  .my-card { background: linear-gradient(135deg, #1a2340 0%, #1e2535 100%); border: 1px solid var(--accent); border-radius: 14px; padding: 20px 22px; margin-bottom: 20px; position: relative; overflow: hidden; }
  .my-card::before { content: ''; position: absolute; top: -30px; right: -30px; width: 120px; height: 120px; background: var(--accent); opacity: 0.04; border-radius: 50%; }
  .my-card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 10px; }
  .my-card-name { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin-bottom: 14px; }
  .my-nights { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .night-block { background: rgba(0,0,0,0.25); border-radius: 8px; padding: 12px 14px; }
  .night-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .night-loc { font-size: 16px; font-weight: 600; color: var(--text); }
  .night-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .swap-btn { margin-top: 14px; width: 100%; padding: 10px; background: rgba(79,142,247,0.15); border: 1px solid rgba(79,142,247,0.35); border-radius: var(--radius); color: var(--accent); font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .swap-btn:hover { background: rgba(79,142,247,0.25); }

  /* MAIN CONTENT */
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; }
  .tab { flex: 1; padding: 8px 4px; background: none; border: none; border-radius: 7px; color: var(--muted); font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; text-align: center; }
  .tab.active { background: var(--surface2); color: var(--text); }

  /* SECTION LABEL */
  .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 20px 0 10px; }

  /* ROOMS GRID */
  .rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .room-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; transition: border-color 0.15s; }
  .room-card.girls { border-color: rgba(240,98,146,0.4); background: linear-gradient(135deg, #1e1826, #1e2535); }
  .room-card.mine { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(79,142,247,0.2); }
  .room-num { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 600; }
  .badge-pink { background: var(--pink-dim); color: var(--pink); }
  .badge-blue { background: var(--accent-dim); color: var(--accent); }
  .badge-amber { background: var(--amber-dim); color: var(--amber); }
  .badge-green { background: var(--green-dim); color: var(--green); }
  .person-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .person-row:last-child { margin-bottom: 0; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex-shrink: 0; }
  .av-blue { background: var(--accent-dim); color: var(--accent); }
  .av-pink { background: var(--pink-dim); color: var(--pink); }
  .av-teal { background: var(--green-dim); color: var(--green); }
  .av-gray { background: rgba(255,255,255,0.06); color: var(--muted); }
  .av-amber { background: var(--amber-dim); color: var(--amber); }
  .pname { font-size: 12px; color: var(--text); line-height: 1.2; }
  .pname.is-me { color: var(--accent); font-weight: 600; }
  .solo-note { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* TENT */
  .tent-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .tent-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .tent-icon { font-size: 20px; }
  .tent-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
  .tent-count { font-size: 12px; color: var(--muted); margin-left: auto; }
  .tent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
  .tent-person { display: flex; align-items: center; gap: 7px; padding: 6px 9px; background: var(--surface2); border-radius: 7px; }
  .tent-person.is-me { background: var(--accent-dim); border: 1px solid rgba(79,142,247,0.3); }

  /* PEOPLE LOOKUP */
  .lookup-search { width: 100%; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 14px; color: var(--text); font-family: var(--font); font-size: 14px; outline: none; margin-bottom: 12px; }
  .lookup-search:focus { border-color: var(--accent); }
  .lookup-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .lookup-row:last-child { border-bottom: none; }
  .lookup-name { flex: 1; font-size: 13px; min-width: 140px; }
  .lookup-loc { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .lookup-loc b { color: var(--text); }

  /* SWAP REQUESTS (admin) */
  .request-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; }
  .req-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .req-name { font-weight: 600; font-size: 14px; }
  .req-time { font-size: 11px; color: var(--muted); margin-left: auto; }
  .req-note { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .req-actions { display: flex; gap: 8px; }
  .btn-approve { padding: 6px 14px; background: var(--green-dim); border: 1px solid rgba(62,207,142,0.3); border-radius: 7px; color: var(--green); font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-deny { padding: 6px 14px; background: rgba(239,83,80,0.1); border: 1px solid rgba(239,83,80,0.25); border-radius: 7px; color: var(--red); font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer; }
  .status-badge { font-size: 11px; padding: 3px 9px; border-radius: 99px; font-weight: 600; }
  .status-pending { background: var(--amber-dim); color: var(--amber); }
  .status-approved { background: var(--green-dim); color: var(--green); }
  .status-denied { background: rgba(239,83,80,0.1); color: var(--red); }
  .empty-state { padding: 32px 0; text-align: center; color: var(--muted); font-size: 14px; }

  /* SWAP MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; padding: 28px 24px; width: 100%; max-width: 420px; }
  .modal h3 { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .modal textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 12px; color: var(--text); font-family: var(--font); font-size: 14px; resize: vertical; min-height: 90px; outline: none; }
  .modal textarea:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn-cancel { flex: 1; padding: 10px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--muted); font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-submit { flex: 2; padding: 10px; background: var(--accent); border: none; border-radius: var(--radius); color: #fff; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-submit:disabled { opacity: 0.4; }

  /* SWAP BANNER */
  .swap-banner { background: var(--amber-dim); border: 1px solid rgba(255,183,77,0.2); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .swap-banner-text { font-size: 13px; color: var(--amber); font-weight: 600; }

  /* VIEW */
  .view { display: none; }
  .view.active { display: block; }

  /* TOAST */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 18px; font-size: 13px; font-weight: 600; z-index: 999; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  #toast.show { opacity: 1; }

  @media (max-width: 480px) {
    .rooms-grid { grid-template-columns: repeat(2, 1fr); }
    .my-nights { grid-template-columns: 1fr; }
    .header-user .user-name { display: none; }
  }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p>Loading trip data...</p>
</div>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">LORING TRIP</div>
    <div class="login-sub">Lodging assignments &amp; room management</div>
    <label>Who are you?</label>
    <div class="search-wrap">
      <input type="text" id="name-search" placeholder="Search your name..." autocomplete="off" oninput="filterNames(this.value)">
      <div id="name-results"></div>
    </div>
    <button class="btn-primary" id="login-btn" disabled onclick="doLogin()">View My Assignment →</button>
  </div>
</div>

<!-- Main App -->
<div id="app">
  <header>
    <div class="header-inner">
      <div class="header-title">LORING <span>TRIP</span></div>
      <div class="header-user">
        <div class="user-avatar" id="header-avatar"></div>
        <div class="user-name" id="header-name"></div>
        <button class="btn-logout" onclick="doLogout()">Sign out</button>
      </div>
    </div>
  </header>

  <main>
    <!-- My assignment card -->
    <div id="my-card-section"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="showTab('nights12',this)">Nights 1–2</button>
      <button class="tab" onclick="showTab('nights34',this)">Nights 3–4</button>
      <button class="tab" onclick="showTab('lookup',this)">Lookup</button>
      <button class="tab" id="admin-tab" style="display:none" onclick="showTab('admin',this)">Admin</button>
    </div>

    <div id="nights12" class="view active"></div>
    <div id="nights34" class="view"></div>
    <div id="lookup" class="view">
      <input type="search" class="lookup-search" placeholder="Search by name..." oninput="filterLookup(this.value)" id="lookup-input">
      <div id="lookup-list"></div>
    </div>
    <div id="admin" class="view">
      <div id="requests-list"></div>
    </div>
  </main>
</div>

<!-- Swap Modal -->
<div class="modal-overlay" id="swap-modal">
  <div class="modal">
    <h3>Request a Change</h3>
    <p>Describe your request and the superintendent will review it. This does not guarantee a change.</p>
    <textarea id="swap-note" placeholder="e.g. Can I swap rooms with Buckley? We'd prefer to room together nights 1-2."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-submit" id="submit-swap-btn" onclick="submitSwap()">Submit Request</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://tjxbvcjfyiqfqqnadets.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqeGJ2Y2pmeWlxZnFxbmFkZXRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTY5MDEsImV4cCI6MjA5NTQ3MjkwMX0.-btwjLVlds9GDV7SCNpjQOhXML8vfD9MI6Ki-D5vaN0';

const GIRLS = ["King Justine","Melanson Elizabeth","Sharp Stephanie"];
let allPersonnel = [];
let allAssignments = [];
let allRooms = [];
let allRequests = [];
let currentUser = null;
let selectedName = null;

async function sbFetch(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers
    },
    ...opts
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  return opts.noJson ? res : res.json();
}

async function loadData() {
  [allPersonnel, allRooms, allAssignments] = await Promise.all([
    sbFetch('personnel?order=name'),
    sbFetch('rooms?order=room_number'),
    sbFetch('assignments?order=id')
  ]);
}

function initials(name) {
  const p = name.trim().split(' ');
  return (p[0][0] + p[p.length-1][0]).toUpperCase();
}

function getRoomLabel(roomNumber, roomType) {
  if (roomType === 'tent') return 'Tent';
  return 'Room ' + roomNumber;
}

function getAssignmentsForNight(nightGroup) {
  return allAssignments.filter(a => a.night_group === nightGroup || a.night_group === 'all');
}

function getRoomById(id) {
  return allRooms.find(r => r.id === id);
}

function getPersonAssignment(name, nightGroup) {
  const ngs = nightGroup === 'nights_1_2' ? ['nights_1_2','all'] : ['nights_3_4','all'];
  const a = allAssignments.find(x => x.person_name === name && ngs.includes(x.night_group));
  if (!a) return null;
  const room = getRoomById(a.room_id);
  return { assignment: a, room };
}

function getRoommates(personName, roomId, nightGroup) {
  const ngs = nightGroup === 'nights_1_2' ? ['nights_1_2','all'] : ['nights_3_4','all'];
  return allAssignments
    .filter(a => a.room_id === roomId && ngs.includes(a.night_group) && a.person_name !== personName)
    .map(a => a.person_name);
}

// ---- LOGIN ----
function filterNames(val) {
  const res = document.getElementById('name-results');
  selectedName = null;
  document.getElementById('login-btn').disabled = true;
  if (!val.trim()) { res.innerHTML = ''; return; }
  const matches = allPersonnel.filter(p => p.name.toLowerCase().includes(val.toLowerCase())).slice(0, 8);
  if (!matches.length) { res.innerHTML = ''; return; }
  res.innerHTML = matches.map(p =>
    `<div class="name-opt" onclick="selectName('${p.name.replace(/'/g,"\\'")}')"><strong>${p.name}</strong></div>`
  ).join('');
}

function selectName(name) {
  selectedName = name;
  document.getElementById('name-search').value = name;
  document.getElementById('name-results').innerHTML = '';
  document.getElementById('login-btn').disabled = false;
}

function doLogin() {
  if (!selectedName) return;
  currentUser = allPersonnel.find(p => p.name === selectedName);
  localStorage.setItem('loring_user', selectedName);
  showApp();
}

function doLogout() {
  currentUser = null;
  localStorage.removeItem('loring_user');
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-screen').classList.add('active');
  document.getElementById('name-search').value = '';
  selectedName = null;
  document.getElementById('login-btn').disabled = true;
}

// ---- APP ----
function showApp() {
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app').classList.add('active');

  const ini = initials(currentUser.name);
  document.getElementById('header-avatar').textContent = ini;
  document.getElementById('header-name').textContent = currentUser.name;

  if (currentUser.is_admin) {
    document.getElementById('admin-tab').style.display = '';
    loadRequests();
  }

  renderMyCard();
  renderNightsView('nights_1_2', document.getElementById('nights12'));
  renderNightsView('nights_3_4', document.getElementById('nights34'));
  renderLookup('');
}

function renderMyCard() {
  const n12 = getPersonAssignment(currentUser.name, 'nights_1_2');
  const n34 = getPersonAssignment(currentUser.name, 'nights_3_4');
  const sec = document.getElementById('my-card-section');
  if (!n12 && !n34) { sec.innerHTML = ''; return; }

  function nightHTML(data, label) {
    if (!data) return '';
    const { room } = data;
    const isTent = room.room_type === 'tent';
    const loc = isTent ? 'Tent' : 'Room ' + room.room_number;
    const mates = getRoommates(currentUser.name, room.id, label === 'Nights 1–2' ? 'nights_1_2' : 'nights_3_4');
    const detail = isTent ? `${allAssignments.filter(a => a.room_id === room.id && (a.night_group === (label==='Nights 1–2'?'nights_1_2':'nights_3_4') || a.night_group==='all')).length} people` : (mates.length ? mates.map(m => m.split(' ')[0]).join(', ') : 'Solo');
    return `<div class="night-block">
      <div class="night-label">${label}</div>
      <div class="night-loc">${loc}</div>
      <div class="night-detail">${detail}</div>
    </div>`;
  }

  sec.innerHTML = `<div class="my-card">
    <div class="my-card-label">Your Assignment</div>
    <div class="my-card-name">${currentUser.name}</div>
    <div class="my-nights">
      ${nightHTML(n12, 'Nights 1–2')}
      ${nightHTML(n34, 'Nights 3–4')}
    </div>
    <button class="swap-btn" onclick="openModal()">Request a Change</button>
  </div>`;
}

function renderNightsView(nightGroup, container) {
  const label = nightGroup === 'nights_1_2' ? 'Nights 1 & 2' : 'Nights 3 & 4';
  const ngs = nightGroup === 'nights_1_2' ? ['nights_1_2','all'] : ['nights_3_4','all'];
  const assignmentsForNight = allAssignments.filter(a => ngs.includes(a.night_group));

  // Group by room
  const byRoom = {};
  for (const a of assignmentsForNight) {
    if (!byRoom[a.room_id]) byRoom[a.room_id] = [];
    byRoom[a.room_id].push(a.person_name);
  }

  const hotelRooms = allRooms.filter(r => r.room_type !== 'tent').sort((a,b) => a.room_number - b.room_number);
  const tentRoom = allRooms.find(r => r.room_type === 'tent');
  const tentPeople = byRoom[tentRoom?.id] || [];

  const swapNote = nightGroup === 'nights_1_2'
    ? 'Swap happens morning of Day 3'
    : `${tentPeople.length > 0 ? '' : ''}Former tent occupants now in rooms. Some personnel kept in hotel (tent at capacity).`;

  let html = `<div class="swap-banner"><span style="font-size:16px">⚡</span><span class="swap-banner-text">${label} &nbsp;·&nbsp; ${swapNote}</span></div>`;
  html += `<div class="section-label">Hotel Rooms</div><div class="rooms-grid">`;

  for (const room of hotelRooms) {
    const people = byRoom[room.id] || [];
    if (!people.length) continue;
    const isGirls = room.room_type === 'girls';
    const isMine = people.includes(currentUser.name);
    let cls = 'room-card';
    if (isGirls) cls += ' girls';
    if (isMine) cls += ' mine';

    html += `<div class="${cls}">`;
    html += `<div class="room-num">Room ${room.room_number}`;
    if (isGirls) html += ` <span class="badge badge-pink">girls</span>`;
    if (isMine && !isGirls) html += ` <span class="badge badge-blue">you</span>`;
    html += `</div>`;

    for (const p of people) {
      const isMe = p === currentUser.name;
      const av = GIRLS.includes(p) ? 'av-pink' : (isMe ? 'av-amber' : 'av-blue');
      html += `<div class="person-row"><div class="avatar ${av}">${initials(p)}</div><span class="pname${isMe?' is-me':''}">${p}</span></div>`;
    }
    if (people.length === 1 && !isGirls) html += `<div class="solo-note">single occupancy</div>`;
    html += `</div>`;
  }
  html += `</div>`;

  if (tentPeople.length) {
    html += `<div class="section-label">Tent</div>`;
    html += `<div class="tent-card"><div class="tent-header"><span class="tent-icon">⛺</span><span class="tent-title">16-person tent</span><span class="tent-count">${tentPeople.length} assigned</span></div><div class="tent-grid">`;
    for (const p of tentPeople) {
      const isMe = p === currentUser.name;
      html += `<div class="tent-person${isMe?' is-me':''}"><div class="avatar av-teal" style="width:22px;height:22px;font-size:9px">${initials(p)}</div><span style="font-size:12px">${p}</span></div>`;
    }
    html += `</div></div>`;
  }

  container.innerHTML = html;
}

// ---- LOOKUP ----
function buildLookupData() {
  return allPersonnel.map(p => {
    const n12 = getPersonAssignment(p.name, 'nights_1_2');
    const n34 = getPersonAssignment(p.name, 'nights_3_4');
    const loc12 = n12 ? (n12.room.room_type === 'tent' ? 'Tent' : 'Room ' + n12.room.room_number) : '—';
    const loc34 = n34 ? (n34.room.room_type === 'tent' ? 'Tent' : 'Room ' + n34.room.room_number) : '—';
    return { name: p.name, loc12, loc34, isGirl: GIRLS.includes(p.name) };
  }).sort((a,b) => a.name.split(' ').slice(-1)[0].localeCompare(b.name.split(' ').slice(-1)[0]));
}

function renderLookup(val) {
  const data = buildLookupData();
  const filtered = val ? data.filter(d => d.name.toLowerCase().includes(val.toLowerCase())) : data;
  const list = document.getElementById('lookup-list');
  if (!list) return;
  list.innerHTML = filtered.map(d => {
    const isMe = d.name === currentUser?.name;
    return `<div class="lookup-row">
      <div class="avatar ${d.isGirl ? 'av-pink' : (isMe ? 'av-amber' : 'av-blue')}" style="width:28px;height:28px;font-size:10px">${initials(d.name)}</div>
      <span class="lookup-name">${d.name}${d.isGirl ? ' <span class="badge badge-pink" style="vertical-align:2px">girls</span>' : ''}${isMe ? ' <span class="badge badge-blue" style="vertical-align:2px">you</span>' : ''}</span>
      <span class="lookup-loc">N1–2: <b>${d.loc12}</b></span>
      <span class="lookup-loc">N3–4: <b>${d.loc34}</b></span>
    </div>`;
  }).join('') || '<div class="empty-state">No results</div>';
}

window.filterLookup = function(val) { renderLookup(val); };

// ---- SWAP MODAL ----
function openModal() {
  document.getElementById('swap-modal').classList.add('active');
  document.getElementById('swap-note').value = '';
}
function closeModal() {
  document.getElementById('swap-modal').classList.remove('active');
}

async function submitSwap() {
  const note = document.getElementById('swap-note').value.trim();
  if (!note) { showToast('Please describe your request.'); return; }
  const btn = document.getElementById('submit-swap-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  const n12 = getPersonAssignment(currentUser.name, 'nights_1_2');
  try {
    await sbFetch('swap_requests', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify({
        requester_name: currentUser.name,
        current_assignment_id: n12?.assignment?.id || null,
        request_note: note,
        status: 'pending'
      })
    });
    closeModal();
    showToast('Request submitted! The superintendent will review it.');
  } catch(e) {
    showToast('Error submitting request. Try again.');
  }
  btn.disabled = false;
  btn.textContent = 'Submit Request';
}

// ---- ADMIN ----
async function loadRequests() {
  allRequests = await sbFetch('swap_requests?order=created_at.desc');
  renderRequests();
}

function renderRequests() {
  const container = document.getElementById('requests-list');
  if (!container) return;
  const pending = allRequests.filter(r => r.status === 'pending');
  const resolved = allRequests.filter(r => r.status !== 'pending');

  let html = `<div class="section-label">Pending Requests (${pending.length})</div>`;
  if (!pending.length) html += `<div class="empty-state">No pending requests</div>`;
  for (const r of pending) {
    html += requestCardHTML(r);
  }
  if (resolved.length) {
    html += `<div class="section-label" style="margin-top:24px">Resolved (${resolved.length})</div>`;
    for (const r of resolved) html += requestCardHTML(r);
  }
  container.innerHTML = html;
}

function requestCardHTML(r) {
  const d = new Date(r.created_at);
  const timeStr = d.toLocaleDateString('en-US', { month:'short', day:'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  const statusCls = r.status === 'pending' ? 'status-pending' : r.status === 'approved' ? 'status-approved' : 'status-denied';
  return `<div class="request-card">
    <div class="req-meta">
      <div class="avatar av-blue" style="width:28px;height:28px;font-size:10px">${initials(r.requester_name)}</div>
      <span class="req-name">${r.requester_name}</span>
      <span class="status-badge ${statusCls}">${r.status}</span>
      <span class="req-time">${timeStr}</span>
    </div>
    <div class="req-note">${r.request_note || '—'}</div>
    ${r.status === 'pending' ? `<div class="req-actions">
      <button class="btn-approve" onclick="resolveRequest(${r.id},'approved')">Approve</button>
      <button class="btn-deny" onclick="resolveRequest(${r.id},'denied')">Deny</button>
    </div>` : `<div style="font-size:12px;color:var(--muted)">Reviewed by ${r.reviewed_by || 'admin'}</div>`}
  </div>`;
}

window.resolveRequest = async function(id, status) {
  await sbFetch(`swap_requests?id=eq.${id}`, {
    method: 'PATCH',
    prefer: 'return=minimal',
    body: JSON.stringify({ status, reviewed_by: currentUser.name, reviewed_at: new Date().toISOString() })
  });
  await loadRequests();
  showToast(`Request ${status}.`);
};

// ---- UTILS ----
function showTab(id, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  if (id === 'lookup') renderLookup(document.getElementById('lookup-input')?.value || '');
  if (id === 'admin') loadRequests();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ---- INIT ----
async function init() {
  try {
    await loadData();
    document.getElementById('loading').style.display = 'none';
    const saved = localStorage.getItem('loring_user');
    if (saved && allPersonnel.find(p => p.name === saved)) {
      currentUser = allPersonnel.find(p => p.name === saved);
      showApp();
    } else {
      document.getElementById('login-screen').classList.add('active');
    }
  } catch(e) {
    document.getElementById('loading').innerHTML = `<p style="color:#ef5350">Failed to load data. Check your connection.</p>`;
  }
}

init();
</script>
